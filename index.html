<!DOCTYPE html>
<!--
  `class="dark"` is declared here rather than toggled from JavaScript.
  Previously App.tsx and PageTransition.tsx both wrote to
  documentElement/body on mount, and the two cleanups fought each other.
  Declaring it statically also removes the flash of light theme on first paint.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Innovo — Innovative Software Solutions</title>
    <meta
      name="description"
      content="Creating innovative tech solutions with a focus on clean design, intuitive user experience, and cutting-edge technology."
    />
    <meta name="author" content="Innovo" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!--
      Inter is loaded here rather than via @import in the stylesheet: an @import
      blocks first paint and is discovered late, while a <link> in the head is
      found by the preload scanner. Preconnect removes the extra DNS + TLS
      round-trip to the font host.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      Open Graph / Twitter. og:image and og:url MUST be absolute URLs —
      the template previously used a relative "/og-image.png", which most
      crawlers cannot resolve.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Innovo" />
    <meta
      property="og:title"
      content="Innovo — Innovative Software Solutions"
    />
    <meta
      property="og:description"
      content="Creating innovative tech solutions with a focus on clean design, intuitive user experience, and cutting-edge technology."
    />
    <meta property="og:url" content="https://pradeepdeuba.com.np/" />
    <meta property="og:image" content="https://pradeepdeuba.com.np/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://pradeepdeuba.com.np/" />
  </head>

  <body class="custom-scrollbar grain">
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
