<!DOCTYPE html>
<html lang="en" data-theme="signal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pradeep Deuba — IoT Developer &amp; Full Stack Engineer</title>
    <meta
      name="description"
      content="Based in Kathmandu, Nepal. IoT development, embedded firmware and full stack engineering — ESP32 hardware, sensors and the dashboards they report to."
    />
    <meta name="author" content="Pradeep Deuba" />
    <meta name="theme-color" content="#08090a" />

    <link rel="icon" href="/portfolio/favicon.ico" sizes="any" />

    <!--
      Loaded here rather than via @import in the stylesheet: an @import blocks
      first paint and is discovered late, while a <link> in the head is found by
      the preload scanner. Two families, one request:
        Inter     body copy and labels for every theme
        Fraunces  the high-contrast serif display used by the Signal theme
      Fraunces is requested as a variable axis range, so one file covers the
      whole optical-size and weight range. The editorial and brutalist themes
      use system stacks and ignore both.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      Open Graph / Twitter. og:image and og:url MUST be absolute URLs — the
      template previously used a relative "/og-image.png", which most crawlers
      cannot resolve.
      og:image points at the real portrait; a purpose-made 1200x630 crop would
      give better previews than a 4:5 source.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pradeep Deuba" />
    <meta property="og:title" content="Pradeep Deuba — IoT Developer &amp; Full Stack Engineer" />
    <meta
      property="og:description"
      content="Based in Kathmandu, Nepal. IoT development, embedded firmware and full stack engineering."
    />
    <meta property="og:url" content="https://pradeepdeuba.com.np/" />
    <meta property="og:image" content="https://i.imgur.com/v5XPH7T.jpeg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://pradeepdeuba.com.np/" />

    <!--
      Applies the saved theme before first paint. Without this the default theme
      would flash before React hydrates. Kept inline and dependency-free on
      purpose; ThemeProvider reads the same key afterwards.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("portfolio-theme");
          if (saved) document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {
          /* private mode — the default theme is already on <html> */
        }
      })();
    </script>
    <script type="module" crossorigin src="/portfolio/assets/index-BlvuyXXE.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio/assets/index-CeAuEZtr.css">
  </head>

  <body class="custom-scrollbar grain">
    <div id="root"></div>
  </body>
</html>
